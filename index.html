<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <h1>Connect Four</h1>

    <div class="score">
      <span id="player1Score">Player 1: 0</span>
      <span id="player2Score">Player 2: 0</span>
    </div>

    <p id="turnText">Player 1's turn</p>

    <div id="columnButtons" class="column-buttons"></div>
    <div id="board" class="board"></div>

    <div class="controls">
      <button id="newRoundBtn">New Round</button>
      <button id="resetScoreBtn">Reset Score</button>
      <button id="tutorialBtn">Tutorial</button>
    </div>
  </div>

  <dialog id="nameDialog">
    <h2>Player Setup</h2>
    <input id="player1Input" type="text" placeholder="Player 1 name">
    <input id="player2Input" type="text" placeholder="Player 2 name">
    <button id="startBtn">Start Game</button>
  </dialog>

  <dialog id="tutorialDialog">
    <h2>How to Play</h2>
    <p>1. Tap a column number.</p>
    <p>2. Your piece drops into that column.</p>
    <p>3. Connect 4 pieces horizontally, vertically, or diagonally.</p>
    <button id="closeTutorialBtn">Close</button>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
